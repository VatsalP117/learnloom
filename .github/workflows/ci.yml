name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: learnloom_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d learnloom_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Validate operational artifacts
        run: |
          bash -n scripts/restore-drill.sh
          jq empty infra/monitoring/learnloom-dashboard.json
          jq empty docs/research/interview-corpus-v1.template.json
      - name: Start S3-compatible integration service
        run: |
          docker run -d --name learnloom-minio-ci \
            -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-08-13T08-35-41Z -ec \
            'mc alias set ci http://127.0.0.1:9000 minioadmin minioadmin &&
             mc mb --ignore-existing ci/learnloom-test'
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./cmd/... ./internal/...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./cmd/... ./internal/...
      - run: go test -race ./cmd/... ./internal/...
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/learnloom_test?sslmode=disable
          TEST_S3_ENDPOINT: http://127.0.0.1:9000
          TEST_S3_BUCKET: learnloom-test
          TEST_S3_ACCESS_KEY_ID: minioadmin
          TEST_S3_SECRET_ACCESS_KEY: minioadmin
      - name: Execute aggregate evidence reports
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/learnloom_test?sslmode=disable
        run: |
          go run ./cmd/learnloom migrate
          psql "$DATABASE_URL" -X -f scripts/product-baseline.sql >/dev/null
          psql "$DATABASE_URL" -X -f scripts/design-partner-beta-report.sql >/dev/null
          psql "$DATABASE_URL" -X -f scripts/billing-economics.sql >/dev/null
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./cmd/... ./internal/...
      - run: npm audit --audit-level=high
      - run: docker build --build-arg VITE_CLERK_PUBLISHABLE_KEY=pk_test_placeholder .
