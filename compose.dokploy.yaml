name: learnloom

x-app: &app
  image: ${LEARNLOOM_IMAGE:-learnloom-app}:${LEARNLOOM_IMAGE_TAG:-production}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?set VITE_CLERK_PUBLISHABLE_KEY}
      VITE_LEARNLOOM_ROOT_DOMAIN: ${VITE_LEARNLOOM_ROOT_DOMAIN:-learnloom.blog}
  read_only: true
  tmpfs:
    - /tmp:size=64m,noexec,nosuid
  security_opt:
    - no-new-privileges:true
  networks:
    - backend

x-runtime: &runtime
  LEARNLOOM_ENV: production
  # Docker builds bake an immutable source fingerprint into the binary. An
  # explicit value remains available for externally built images.
  LEARNLOOM_RELEASE_VERSION: ${LEARNLOOM_RELEASE_VERSION:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LEARNLOOM_ROOT_DOMAIN: ${LEARNLOOM_ROOT_DOMAIN:-learnloom.blog}
  ALLOW_INSECURE_PRIVATE_SERVICES: "true"
  DATABASE_URL: postgresql://learnloom:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/learnloom?sslmode=disable
  PAID_COMMERCE_APPROVED: ${PAID_COMMERCE_APPROVED:-false}
  PAID_COMMERCE_APPROVAL_REFERENCE: ${PAID_COMMERCE_APPROVAL_REFERENCE:-}
  # Optional: error capture to Sentry from the web and worker roles.
  SENTRY_DSN: ${SENTRY_DSN:-}

x-object-store: &object-store
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_REGION: ${S3_REGION:-auto}
  S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-false}
  ARTIFACT_CACHE_BYTES: ${ARTIFACT_CACHE_BYTES:-67108864}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: learnloom
      POSTGRES_USER: learnloom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnloom -d learnloom"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - backend
    labels:
      - "com.learnloom.monitor=true"
      - "com.learnloom.service=postgres"
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["migrate"]
    environment:
      <<: *runtime
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "com.learnloom.monitor=true"
      - "com.learnloom.service=migrate"
    restart: "no"

  web:
    <<: *app
    command: ["web"]
    environment:
      <<: [*runtime, *object-store]
      HTTP_ADDR: :3000
      WEB_METRICS_ADDR: :9091
      LEARNLOOM_APP_ORIGIN: ${LEARNLOOM_APP_ORIGIN:-https://app.learnloom.blog}
      FEATURED_SITE_USERNAMES: ${FEATURED_SITE_USERNAMES:-}
      CSRF_SECRET: ${CSRF_SECRET:?set CSRF_SECRET}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?set CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}
      # Optional: without this override, Clerk's server SDK retrieves the
      # current signing key safely from Clerk and handles key rotation.
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:?set CLERK_WEBHOOK_SECRET}
      CLERK_FRONTEND_ORIGIN: ${CLERK_FRONTEND_ORIGIN:?set CLERK_FRONTEND_ORIGIN}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_API_BASE_URL: ${PADDLE_API_BASE_URL:-https://api.paddle.com}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN:-}
      PADDLE_ESSENTIAL_PRICE_ID: ${PADDLE_ESSENTIAL_PRICE_ID:-}
      PADDLE_PRO_PRICE_ID: ${PADDLE_PRO_PRICE_ID:-}
      SOURCE_DISCOVERY_ENABLED: ${SOURCE_DISCOVERY_ENABLED:-true}
      SEARXNG_BASE_URL: http://searxng:8080
      SEARXNG_TIMEOUT: ${SEARXNG_TIMEOUT:-8s}
      SOURCE_DISCOVERY_MAX_QUERIES: ${SOURCE_DISCOVERY_MAX_QUERIES:-5}
      SOURCE_DISCOVERY_MAX_CANDIDATES: ${SOURCE_DISCOVERY_MAX_CANDIDATES:-30}
      SOURCE_DISCOVERY_MAX_ACTIVE: ${SOURCE_DISCOVERY_MAX_ACTIVE:-8}
      SOURCE_FETCH_CONCURRENCY: ${SOURCE_FETCH_CONCURRENCY:-4}
      SOURCE_MIN_USABLE_ITEMS: ${SOURCE_MIN_USABLE_ITEMS:-4}
      SOURCE_TARGET_USABLE_ITEMS: ${SOURCE_TARGET_USABLE_ITEMS:-8}
      SOURCE_REFRESH_INTERVAL: ${SOURCE_REFRESH_INTERVAL:-12h}
      SOURCE_DEFAULT_MAX_STALE_AGE: ${SOURCE_DEFAULT_MAX_STALE_AGE:-720h}
      GLOBAL_DAILY_MODEL_BUDGET_MICRO_USD: ${GLOBAL_DAILY_MODEL_BUDGET_MICRO_USD:?set GLOBAL_DAILY_MODEL_BUDGET_MICRO_USD}
      MODEL_MAX_ESTIMATED_COST_MICRO_USD_PER_ISSUE: ${MODEL_MAX_ESTIMATED_COST_MICRO_USD_PER_ISSUE:?set MODEL_MAX_ESTIMATED_COST_MICRO_USD_PER_ISSUE}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
      - "9091"
    labels: &web-traefik-labels
      - "com.learnloom.monitor=true"
      - "com.learnloom.service=web"
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.learnloom-web.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.learnloom-compress.compress=true"
      - "traefik.http.routers.learnloom-apex-web.rule=Host(`learnloom.blog`)"
      - "traefik.http.routers.learnloom-apex-web.entrypoints=web"
      - "traefik.http.routers.learnloom-apex-web.middlewares=redirect-to-https@file"
      - "traefik.http.routers.learnloom-apex-websecure.rule=Host(`learnloom.blog`)"
      - "traefik.http.routers.learnloom-apex-websecure.entrypoints=websecure"
      - "traefik.http.routers.learnloom-apex-websecure.tls=true"
      - "traefik.http.routers.learnloom-apex-websecure.service=learnloom-web"
      - "traefik.http.routers.learnloom-apex-websecure.middlewares=learnloom-compress"
      - "traefik.http.routers.learnloom-www-web.rule=Host(`www.learnloom.blog`)"
      - "traefik.http.routers.learnloom-www-web.entrypoints=web"
      - "traefik.http.routers.learnloom-www-web.middlewares=redirect-to-https@file"
      - "traefik.http.routers.learnloom-www-websecure.rule=Host(`www.learnloom.blog`)"
      - "traefik.http.routers.learnloom-www-websecure.entrypoints=websecure"
      - "traefik.http.routers.learnloom-www-websecure.tls=true"
      - "traefik.http.routers.learnloom-www-websecure.service=learnloom-web"
      - "traefik.http.routers.learnloom-www-websecure.middlewares=learnloom-compress"
      - "traefik.http.routers.learnloom-app-web.rule=Host(`app.learnloom.blog`)"
      - "traefik.http.routers.learnloom-app-web.entrypoints=web"
      - "traefik.http.routers.learnloom-app-web.middlewares=redirect-to-https@file"
      - "traefik.http.routers.learnloom-app-websecure.rule=Host(`app.learnloom.blog`)"
      - "traefik.http.routers.learnloom-app-websecure.entrypoints=websecure"
      - "traefik.http.routers.learnloom-app-websecure.tls=true"
      - "traefik.http.routers.learnloom-app-websecure.service=learnloom-web"
      - "traefik.http.routers.learnloom-app-websecure.middlewares=learnloom-compress"
      - 'traefik.http.routers.learnloom-personal-sites-web.rule=HostRegexp(`[a-z][a-z0-9-]{2,29}\.learnloom\.blog`)'
      - "traefik.http.routers.learnloom-personal-sites-web.entrypoints=web"
      - "traefik.http.routers.learnloom-personal-sites-web.middlewares=redirect-to-https@file"
      - 'traefik.http.routers.learnloom-personal-sites-websecure.rule=HostRegexp(`[a-z][a-z0-9-]{2,29}\.learnloom\.blog`)'
      - "traefik.http.routers.learnloom-personal-sites-websecure.entrypoints=websecure"
      - "traefik.http.routers.learnloom-personal-sites-websecure.tls=true"
      - "traefik.http.routers.learnloom-personal-sites-websecure.service=learnloom-web"
      - "traefik.http.routers.learnloom-personal-sites-websecure.middlewares=learnloom-compress"
    deploy:
      labels: *web-traefik-labels
    networks:
      - backend
      - dokploy-network
    restart: unless-stopped

  worker:
    <<: *app
    command: ["worker"]
    stop_grace_period: 20m
    environment:
      <<: [*runtime, *object-store]
      WORKER_METRICS_ADDR: :9090
      WORKER_ISSUE_TIMEOUT: ${WORKER_ISSUE_TIMEOUT:-45m}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.deepseek.com}
      MODEL_API_KEY: ${MODEL_API_KEY:?set MODEL_API_KEY}
      MODEL_NAME: ${MODEL_NAME:-deepseek-v4-flash}
      MODEL_STRUCTURED_OUTPUT: ${MODEL_STRUCTURED_OUTPUT:-true}
      MODEL_TIMEOUT: ${MODEL_TIMEOUT:-10m}
      MODEL_RETRIES: ${MODEL_RETRIES:-2}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-8192}
      MODEL_INPUT_MICRO_USD_PER_MILLION_TOKENS: ${MODEL_INPUT_MICRO_USD_PER_MILLION_TOKENS:?set MODEL_INPUT_MICRO_USD_PER_MILLION_TOKENS}
      MODEL_OUTPUT_MICRO_USD_PER_MILLION_TOKENS: ${MODEL_OUTPUT_MICRO_USD_PER_MILLION_TOKENS:?set MODEL_OUTPUT_MICRO_USD_PER_MILLION_TOKENS}
      GLOBAL_DAILY_MODEL_BUDGET_MICRO_USD: ${GLOBAL_DAILY_MODEL_BUDGET_MICRO_USD:?set GLOBAL_DAILY_MODEL_BUDGET_MICRO_USD}
      MODEL_MAX_ESTIMATED_COST_MICRO_USD_PER_ISSUE: ${MODEL_MAX_ESTIMATED_COST_MICRO_USD_PER_ISSUE:?set MODEL_MAX_ESTIMATED_COST_MICRO_USD_PER_ISSUE}
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM:?set RESEND_FROM}
      RESEND_SUBJECT_PREFIX: ${RESEND_SUBJECT_PREFIX:-Learnloom}
      SOURCE_DISCOVERY_ENABLED: ${SOURCE_DISCOVERY_ENABLED:-true}
      SEARXNG_BASE_URL: http://searxng:8080
      SEARXNG_TIMEOUT: ${SEARXNG_TIMEOUT:-8s}
      SOURCE_DISCOVERY_MAX_QUERIES: ${SOURCE_DISCOVERY_MAX_QUERIES:-5}
      SOURCE_DISCOVERY_MAX_CANDIDATES: ${SOURCE_DISCOVERY_MAX_CANDIDATES:-30}
      SOURCE_DISCOVERY_MAX_ACTIVE: ${SOURCE_DISCOVERY_MAX_ACTIVE:-8}
      SOURCE_FETCH_CONCURRENCY: ${SOURCE_FETCH_CONCURRENCY:-4}
      SOURCE_MIN_USABLE_ITEMS: ${SOURCE_MIN_USABLE_ITEMS:-4}
      SOURCE_TARGET_USABLE_ITEMS: ${SOURCE_TARGET_USABLE_ITEMS:-8}
      SOURCE_REFRESH_INTERVAL: ${SOURCE_REFRESH_INTERVAL:-12h}
      SOURCE_DEFAULT_MAX_STALE_AGE: ${SOURCE_DEFAULT_MAX_STALE_AGE:-720h}
    depends_on:
      migrate:
        condition: service_completed_successfully
      searxng:
        condition: service_started
    labels:
      - "com.learnloom.monitor=true"
      - "com.learnloom.service=worker"
    restart: unless-stopped

  searxng:
    image: ${SEARXNG_IMAGE_NAME:-learnloom-searxng}:2026.7.18
    build:
      context: ./infra/searxng
      dockerfile: Dockerfile
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_VALKEY_URL: valkey://searxng-valkey:6379/0
    volumes:
      - searxng-cache:/var/cache/searxng
    depends_on:
      searxng-valkey:
        condition: service_healthy
    networks:
      - backend
    labels:
      - "com.learnloom.monitor=true"
      - "com.learnloom.service=searxng"
    restart: unless-stopped

  searxng-valkey:
    image: docker.io/valkey/valkey:9.0.3-alpine
    command: ["valkey-server", "--save", "30", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - searxng-valkey-data:/data
    networks:
      - backend
    labels:
      - "com.learnloom.monitor=true"
      - "com.learnloom.service=searxng-valkey"
    restart: unless-stopped

volumes:
  postgres-data:
  searxng-cache:
  searxng-valkey-data:

networks:
  backend:
    name: learnloom-backend
  dokploy-network:
    external: true
